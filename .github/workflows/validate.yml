name: Validate MoviePilot plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile plugin
        run: python -m py_compile plugins.v2/removelinkfix/__init__.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
